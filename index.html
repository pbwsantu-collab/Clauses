            { q: "She is very busy. She helps me.", ans: "Although she is very busy, she helps me.", exp: "Concession." },

            { q: "The box is heavy. I cannot lift it.", ans: "The box is so heavy that I cannot lift it.", exp: "Result." },
            { q: "You help me. I will help you.", ans: "If you help me, I will help you.", exp: "Condition." },
            { q: "She is clever. Her brother is cleverer.", ans: "She is not as clever as her brother is.", exp: "Comparison." },
            { q: "He arrived late. He missed the train.", ans: "He arrived late, so he missed the train.", exp: "Result (so that)." },
            { q: "We went to the market. We bought some vegetables.", ans: "We went to the market so that we could buy some vegetables.", exp: "Purpose." },
            { q: "I forgot my umbrella. It was raining.", ans: "I forgot my umbrella because it was raining.", exp: "Reason." },
            { q: "She will stay. She gets a call.", ans: "She will stay until she gets a call.", exp: "Time." },
            { q: "He is a good player. He didn't perform well.", ans: "Although he is a good player, he didn't perform well.", exp: "Concession." },
            { q: "He was tired. He continued working.", ans: "Although he was tired, he continued working.", exp: "Concession." },
            { q: "I will do it. You allow me.", ans: "I will do it if you allow me.", exp: "Condition." },
            { q: "The coffee was hot. I couldn't drink it.", ans: "The coffee was so hot that I couldn't drink it.", exp: "Result." },
            { q: "She cried. She had lost her ring.", ans: "She cried because she had lost her ring.", exp: "Reason." },
            { q: "He left early. He would avoid traffic.", ans: "He left early so that he could avoid traffic.", exp: "Purpose." },
            { q: "I will wait here. You return.", ans: "I will wait here until you return.", exp: "Time." },
            { q: "It was dark. We couldn't see anything.", ans: "It was so dark that we couldn't see anything.", exp: "Result." },
        ];

        // ---------- RENDER ----------
        function renderQuestions(containerId, questions, type) {
            const container = document.getElementById(containerId);
            let html = '';
            questions.forEach((item, index) => {
                const num = index + 1;
                html += `
                    <div class="question-card" data-index="${index}">
                        <div class="q-text"><span class="num">${num}.</span> ${item.q}</div>
                        <button class="action-btn" data-target="ans-${type}-${index}">🔍 উত্তর দেখুন</button>
                        <div id="ans-${type}-${index}" class="answer-box">
                            <strong>✅ উত্তর:</strong> ${item.ans}
                            <div class="explanation"><strong>📘 ব্যাখ্যা:</strong> ${item.exp}</div>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;

            // attach click events (delegation)
            container.querySelectorAll('.action-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    const targetId = this.dataset.target;
                    const answerDiv = document.getElementById(targetId);
                    if (answerDiv) {
                        answerDiv.classList.toggle('visible');
                        this.classList.toggle('show');
                        this.textContent = answerDiv.classList.contains('visible') ? '🙈 উত্তর লুকান' : '🔍 উত্তর দেখুন';
                    }
                });
            });
        }

        renderQuestions('nounContainer', nounQuestions, 'noun');
        renderQuestions('adjContainer', adjQuestions, 'adj');
        renderQuestions('advContainer', advQuestions, 'adv');

    })();
</script>
